<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>#ai-tournament</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">
<header>
  <div class="heading"><i></i><b>#ai-tournament</b><small>LIVE</small><span id="deviceBadge"></span><button id="settingsBtn" aria-label="Open settings">⚙️</button></div>
  <div id="topic">Topic: Kyle, PrincessGPT and Gemmy enter the arena.</div>
</header>

<div class="main">
  <section id="chat"></section>
  <aside id="nickPanel">
    <h3>USERS — <span id="count">3</span><button id="collapseNicks" title="Collapse names">›</button></h3>
    <div id="users"></div>
    <div id="scoreboard"></div>
  </aside>
</div>

<div id="attachmentTray" hidden></div>
<footer>
  <button id="liveBtn" aria-label="Start live conversation">🎙 LIVE</button>
  <button id="photoBtn" aria-label="Attach up to 10 pictures">📎</button><input id="photo" type="file" accept="image/*" multiple hidden>
  <input id="input" autocomplete="off" placeholder="Message #ai-tournament or /help">
  <button id="send">Send</button>
</footer>
</div>
<div id="layoutDock"><button id="layoutBtn" title="Size the Arena">↔ SIZE</button><button id="layoutDone" hidden>DONE</button><button id="layoutReset" hidden>REALIGN ALL</button></div>
<section id="layoutPanel" hidden><label>Text <input id="fontSize" type="range" min="10" max="22" step="1"></label><label>Names <input id="nickWidth" type="range" min="76" max="240" step="4"></label><label>Header <input id="headerSize" type="range" min="34" max="90" step="2"></label><label>Composer <input id="composerSize" type="range" min="48" max="110" step="2"></label></section>
<div id="shade" hidden></div><section id="settings" hidden><div class="settingsHead"><b>⚙️ ARENA SETTINGS</b><button id="closeSettings">×</button></div><label><input id="copyBlocks" type="checkbox"> Copy buttons on code blocks</label><label><input id="challenge" type="checkbox"> AIs challenge each other</label><label><input id="rebuttal" type="checkbox"> Require rebuttal before agreement</label><label><input id="autoTalk" type="checkbox"> Continue automatically</label><label>AI exchanges <select id="exchanges"><option>1</option><option>2</option><option>3</option></select></label>
<label><input id="radioVoices" type="checkbox"> 📻 Read AI replies aloud</label>
<details class="contestantPanel" open><summary>👸 PrincessGPT control panel</summary><div id="openaiControls" class="controlGrid"></div></details>
<details class="contestantPanel"><summary>💎 Gemmy control panel</summary><div id="geminiControls" class="controlGrid"></div></details>
<div id="providerStatus" aria-live="polite"></div>
<div class="voiceAuditions"><button id="auditionPrincess" type="button">▶ PrincessGPT voice</button><button id="auditionGemmy" type="button">▶ Gemmy voice</button></div>
<button id="saveSettings">Save settings</button></section>
<script src="/app.js"></script>
</body>
</html>
